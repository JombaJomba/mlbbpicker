<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MLBB Server Picker</title>
<style>
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center;
    justify-content: center; background: #0b0e13; color: #e3e8ef;
    font-family: system-ui, sans-serif;
  }
  .card {
    text-align: center; background: #12161d; border-radius: 20px;
    padding: 32px 28px; max-width: 340px; box-shadow: 0 10px 40px rgba(0,0,0,.5);
  }
  h1 { font-size: 22px; margin: 0 0 8px; }
  p  { font-size: 14px; color: #b9c2ce; margin: 0 0 20px; }
  a.btn {
    display: block; padding: 12px; margin-top: 10px; border-radius: 12px;
    text-decoration: none; font-weight: 600; font-size: 15px;
  }
  .open { background: #2e7d32; color: #fff; }
  .tg   { background: #2aabee; color: #062033; }
</style>
</head>
<body>
<div class="card">
  <h1>MLBB Server Picker</h1>
  <p id="status">Открываю приложение…</p>
  <a class="btn open" href="mlbbpicker://open">Открыть приложение</a>
  <a class="btn tg" href="https://t.me/silentpower_V">Скачать в Telegram-канале</a>
</div>
<script>
  // 1) пробуем открыть приложение
  window.location.replace('mlbbpicker://open');
  // 2) если через 1.5 с приложение не перехватило экран — уводим в канал
  setTimeout(function () {
    document.getElementById('status').textContent =
      'Приложение не установлено? Скачай в канале:';
    document.location = 'https://t.me/silentpower_V';
  }, 1500);
</script>
</body>
</html>
